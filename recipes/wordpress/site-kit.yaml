id: wp-plugin-site-kit
platform: wordpress
kind: plugin
name: Site Kit by Google
category: analytics
recognize:
  handles:
    - google_gtagjs
    - googlesitekit-consent-mode
  paths:
    - /wp-content/plugins/google-site-kit/
  domains:
    - www.googletagmanager.com
  globals:
    - gtag
    - dataLayer
  classes: []
versionsVerified: []
needs:
  pageTypes:
    - every page
  markers: []
inlineDependencies: []
safeOptimizations: []
neverDelay: true
delayable: false
knownBreakages:
  - Delaying the base tag loses page_view (SAFE-02)
verify:
  - tracking guard in both consent states
confidence: 0.3
notes: "Seed recipe: identifiers and behaviour notes only, no vendor code.
  Confidence rises after verification on a fixture or a real job (SPEC.md
  15.6)."
