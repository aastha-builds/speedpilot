# Sandbox fallback for the WordPress fixture when wp-env cannot reach wordpress.org.
# Used by `pnpm fixtures:wp up --engine compose`. Local only, port 8888, same layout as .wp-env.json.
name: speedpilot-fixture-wp
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: fixture-only
      MARIADB_ROOT_PASSWORD: fixture-only-root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40
  wordpress:
    image: wordpress:php8.3
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8888:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: fixture-only
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_HOME', 'http://localhost:8888' );
        define( 'WP_SITEURL', 'http://localhost:8888' );
        define( 'SPEEDPILOT_HMAC_SECRET', 'fixture-only-hmac-secret-not-for-production' );
        define( 'SPEEDPILOT_FIXTURE_THIRDPARTY', 'http://127.0.0.1:8890' );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
    volumes: &wpvolumes
      - wp_data:/var/www/html
      - ./theme/speedpilot-fixture:/var/www/html/wp-content/themes/speedpilot-fixture:ro
      - ./mu-plugins/speedpilot-fixture-planter.php:/var/www/html/wp-content/mu-plugins/speedpilot-fixture-planter.php:ro
      - ../../packages/wp-agent/speedpilot-agent.php:/var/www/html/wp-content/mu-plugins/speedpilot-agent.php:ro
      - ../../packages/wp-agent/speedpilot-agent:/var/www/html/wp-content/mu-plugins/speedpilot-agent:ro
      - ./standins/contact-form-7:/var/www/html/wp-content/plugins/contact-form-7:ro
      - ./standins/smart-slider-3:/var/www/html/wp-content/plugins/smart-slider-3:ro
      - ./standins/elementor:/var/www/html/wp-content/plugins/elementor:ro
      - ./.cache/plugins/woocommerce:/var/www/html/wp-content/plugins/woocommerce:ro
      - ./setup:/var/www/setup:ro
  cli:
    image: wordpress:cli-php8.3
    depends_on:
      - wordpress
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: fixture-only
      WORDPRESS_DB_NAME: wordpress
      HOME: /tmp
    volumes: *wpvolumes
    entrypoint: ["sleep", "infinity"]
volumes:
  db_data:
  wp_data:
