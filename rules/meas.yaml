  - id: MEAS-01
    area: MEAS
    title: Noisy lab numbers
    platforms: both
    kind: check
    detect:
      source: audit run metadata (Lighthouse runs, tool versions, response headers, consent detection)
      condition: fewer than 5 runs, or the 5 runs spread more than 10 points.
      automated: true
    evidence: URLs, files, bytes, ms, elements and owners as recorded in runs/<site>/<run-id>/ (see the finding evidence object)
    metric: measurement
    tier: report
    fix: rerun on the same machine with the same Chrome and Lighthouse versions and nothing else running; use the median.
    verify: spread under 10 points.
